<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="خرید، تمدید و مدیریت سرویس‌های آسان‌گذر در سایت">
  <meta name="referrer" content="no-referrer">
  <title>فروشگاه آسان‌گذر</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./shop.css">
  <script src="./shop.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../"><span aria-hidden="true">AG</span> آسان‌گذر</a>
    <nav aria-label="ناوبری">
      <a href="../prices.html">تعرفه‌ها</a>
      <a href="../faq.html">راهنما</a>
      <a href="../contact.html">پشتیبانی</a>
    </nav>
  </header>
  <main>
    <div class="intro">
      <h1>فروشگاه آسان‌گذر</h1>
      <p>خرید، تمدید و مدیریت سرویس‌ها و کیف پول آسان‌گذر.</p>
    </div>
    <section id="app" class="workspace" aria-label="فروشگاه" aria-busy="true">
      <p id="status" role="status"></p>
      <section id="login" hidden aria-labelledby="login-title">
        <h2 id="login-title">ورود به فروشگاه</h2>
        <form id="auth" class="auth-form">
          <div id="signup-name" hidden>
            <label for="display-name">نام نمایشی</label>
            <input id="display-name" autocomplete="nickname" maxlength="80">
          </div>
          <div>
            <label for="username">نام کاربری</label>
            <input id="username" dir="ltr" autocomplete="username" maxlength="32" required>
          </div>
          <div>
            <label for="password">رمز عبور</label>
            <input id="password" dir="ltr" type="password" autocomplete="current-password" required minlength="14">
          </div>
          <div class="actions">
            <button type="submit" id="auth-submit">ورود</button>
            <button type="button" class="secondary" id="toggle-signup">ساخت حساب</button>
          </div>
        </form>
      </section>
      <section id="account" hidden aria-label="حساب فروشگاه">
        <div class="actions">
          <button type="button" id="home" class="secondary">منوی فروشگاه</button>
          <button type="button" id="inbox-open" class="secondary">صندوق پیام</button>
          <button type="button" id="refresh" class="secondary">تازه‌سازی</button>
          <button type="button" id="logout" class="secondary logout">خروج</button>
        </div>
        <section id="inbox" hidden aria-labelledby="inbox-title">
          <h2 id="inbox-title">صندوق پیام سایت</h2>
          <div id="inbox-items" aria-live="polite"></div>
          <div class="actions">
            <button type="button" class="secondary" id="inbox-more" hidden>پیام‌های قدیمی‌تر</button>
            <button type="button" class="secondary" id="inbox-read" hidden>علامت‌گذاری به‌عنوان خوانده‌شده</button>
          </div>
        </section>
        <div id="messages" aria-live="polite"></div>
        <form id="reply" hidden>
          <label for="reply-value" id="reply-label">پاسخ</label>
          <div class="form-row">
            <textarea id="reply-value" rows="3" maxlength="3500"></textarea>
            <input id="reply-secret" type="password" aria-labelledby="reply-label" maxlength="3500" autocomplete="off" hidden>
            <input id="reply-image" aria-labelledby="reply-label" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            <button type="submit">ارسال</button>
          </div>
        </form>
      </section>
      <noscript><p>برای استفاده از فروشگاه، جاوااسکریپت را فعال کن.</p></noscript>
    </section>
    <footer><a href="../">وب‌سایت آسان‌گذر</a></footer>
  </main>
</body>
</html>
