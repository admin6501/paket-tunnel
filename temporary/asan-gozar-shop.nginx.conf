# Include inside the existing HTTPS server block for asan-gozar.ir.
if ($uri !~ ^/(?:index\.html|account\.html|prices\.html|services\.html|network\.html|status\.html|faq\.html|contact\.html|favicon\.svg|app\.webmanifest|app-icon-(?:180|192|512)\.png|(?:app-install|app-worker|prices|script|store|storefront|tickets)\.js|(?:style|store)\.css|server-room\.webp|robots\.txt|sitemap\.xml|shop(?:/?|/index\.html|/api/.*)|\.well-known/(?:acme-challenge|pki-validation)/[A-Za-z0-9._-]+)?$) {
    return 404;
}

location = /shop {
    return 308 /account.html;
}

location ^~ /shop/api/ {
    client_max_body_size 800k;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_cache off;
    access_log off;

    location = /shop/api/uploads/ticket {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /shop/api/action {
        client_max_body_size 7m;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /shop/api/backup/restore {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:8787;
    }
}

location ^~ /shop/ {
    return 308 /account.html;
}

location = /app-worker.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
}

location ~ ^/((index|account|prices|services|network|status|faq|contact)\.html|favicon\.svg|app\.webmanifest)?$ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_cache off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
